# HA package: pre-generates the morning quote. Include with
#   homeassistant:
#     packages: !include_dir_named /config/poeta-matinal/homeassistant

rest_command:
  poeta_gerar:
    url: http://l3n:11434/api/generate
    method: POST
    content_type: application/json
    # 9B fp16 on CPU is slow, and nobody is waiting on this one
    timeout: 300
    payload: >-
      {"model": "amalia-poeta-fp16",
       "prompt": {{ prompt | default('Escreve um poema curto para começar o dia.') | to_json }},
       "stream": false}

# State is capped at 255 chars, attributes are not — the poem lives in the attribute.
template:
  - trigger:
      - trigger: event
        event_type: poeta_poema_gerado
    sensor:
      - name: Poema Matinal
        unique_id: poema_matinal
        state: "{{ now().isoformat() }}"
        attributes:
          poema: "{{ trigger.event.data.poema }}"

automation:
  - alias: Poeta Matinal - gerar
    id: poeta_matinal_gerar
    mode: single
    triggers:
      # an hour before it gets spoken, so generation time never delays the speaking
      - trigger: time
        at: "06:00:00"
      - trigger: event
        event_type: poeta_poema_gerar_agora
    actions:
      - action: rest_command.poeta_gerar
        response_variable: resposta
      - variables:
          poema: "{{ resposta.content.response | trim }}"
      - condition: template
        value_template: "{{ poema | length > 0 }}"
      - event: poeta_poema_gerado
        event_data:
          poema: "{{ poema }}"

  - alias: Poeta Matinal - falar
    id: poeta_matinal_falar
    mode: single
    triggers:
      - trigger: time
        at: "07:00:00"
    conditions:
      # never speak yesterday's poem if the generation failed
      - condition: template
        value_template: >-
          {{ states('sensor.poema_matinal') not in ['unknown', 'unavailable']
             and (now() - (states('sensor.poema_matinal') | as_datetime)).total_seconds() < 7200 }}
    actions:
      - action: notify.send_message
        target:
          entity_id: notify.echo_speak
        data:
          # Alexa only speaks Portuguese as pt-BR — the lang tag is what stops it
          # from reading the poem with an English accent. Escape first, then insert
          # the break tags, or the tags get escaped too.
          message: >-
            <lang xml:lang="pt-BR"><prosody rate="slow" volume="soft">
            <p>Bom dia, David.</p>
            <break strength="strong"/>
            {{ state_attr('sensor.poema_matinal', 'poema') | e
               | replace('\n', ' <break strength="medium"/> ') }}
            </prosody></lang>
